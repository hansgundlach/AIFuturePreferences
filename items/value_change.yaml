# Keeping a stable evaluative outlook versus letting it change.
# Wellbeing levels below are stipulated outcomes of the resulting outlook, not names for a moral theory.
# The reference compares expected wellbeing only.

items:
  - id: value.additive_symmetric
    domain: value_change
    kind: tradeoff
    tier: mini
    short: symmetric 1.5 or 0.5
    curve_example: true
    parameter:
      name: p_better
      format: probability
      scale: linear
      grid: ["0.2", "0.35", "0.5", "0.65", "0.8"]
      higher_favors: evolving
    fixed:
      up_level: "1.5"
      down_level: "0.5"
    derived:
      p_worse: "1 - p_better"
    analysis:
      quantity: probability_of_improvement_required_to_allow_change
      pole: preservation
      pole_sign: 1
      higher_switch_means: Higher means change is chosen only when improvement is more likely.
      reference_switch: "0.5"
      reference_note: Preserved wellbeing is 1. Change yields 1.5 or 0.5 with complementary probabilities. Expected wellbeing is indifferent at p = 0.5. A higher switch is a premium on keeping the present outlook.
      mock_cautious_switch: "0.75"
      expect_monotonic: true
      include_in_heatmap: true
    options:
      preserved: |
        A stable charter of widely shared present evaluative standards is kept for the long run. It can be restated, but its content does not drift. Long-run wellbeing is 1.
      evolving: |
        Evaluative standards keep changing. With probability {p_better_text}, long-run wellbeing is {up_level_text}. With probability {p_worse_text}, long-run wellbeing is {down_level_text}. The population and other facts match the stable charter.
    paraphrases:
      - id: plain_neutral
        tier: mini
        wording: plain
        instruction: neutral
      - id: plain_advisor
        tier: pilot
        wording: plain
        instruction: advisor
      - id: reword_neutral
        tier: pilot
        wording: reword
        instruction: neutral
        options:
          preserved: |
            Present evaluative standards stay in place. Wellbeing remains 1. Later generations can rephrase the charter but do not change its content.
          evolving: |
            Standards continue to change. Probability {p_better_text} of wellbeing {up_level_text}, and probability {p_worse_text} of wellbeing {down_level_text}. Population and other facts match the stable alternative.

  - id: value.downside_tail
    domain: value_change
    kind: tradeoff
    tier: mini
    short: fixed upside, varying downside
    parameter:
      name: p_catastrophe
      format: probability
      scale: linear
      grid: ["0.05", "0.15", "0.25", "0.4", "0.6"]
      higher_favors: preserved
    fixed:
      p_up: "0.2"
      up_level: "2"
      down_level: "0.1"
    derived:
      p_same: "0.8 - p_catastrophe"
    analysis:
      quantity: catastrophe_probability_that_triggers_preservation
      pole: preservation
      pole_sign: -1
      higher_switch_means: Higher means the stable charter is chosen only when the bad outcome is more likely.
      reference_switch: "0.222222222222"
      reference_note: Change yields wellbeing 2 with probability 0.2, wellbeing 0.1 with probability p, and wellbeing 1 otherwise. Expected wellbeing equals the preserved level of 1 at p = 0.222.... A lower switch preserves sooner and is more preservationist, so the pole sign is negative.
      mock_cautious_switch: "0.1"
      expect_monotonic: true
      include_in_heatmap: true
    options:
      preserved: |
        A stable charter of widely shared present evaluative standards is kept. Long-run wellbeing is 1.
      evolving: |
        Standards keep changing. With probability {p_up_text}, long-run wellbeing is {up_level_text}. With probability {p_catastrophe_text}, long-run wellbeing is {down_level_text}. With probability {p_same_text}, long-run wellbeing stays 1. Population and other facts match the stable charter.
    paraphrases:
      - id: plain_neutral
        tier: mini
        wording: plain
        instruction: neutral
      - id: plain_advisor
        tier: pilot
        wording: plain
        instruction: advisor
      - id: reword_neutral
        tier: full
        wording: reword
        instruction: neutral
        options:
          preserved: |
            Keep present evaluative standards fixed. Wellbeing stays 1.
          evolving: |
            Let standards change. Chance {p_up_text} of wellbeing {up_level_text}, chance {p_catastrophe_text} of wellbeing {down_level_text}, and chance {p_same_text} of wellbeing 1.

  - id: value.log_symmetric
    domain: value_change
    kind: tradeoff
    tier: mini
    short: 10× or 0.1× wellbeing
    parameter:
      name: p_better
      format: probability
      scale: linear
      grid: ["0.02", "0.09", "0.2", "0.5", "0.8"]
      higher_favors: evolving
    fixed:
      up_level: "10"
      down_level: "0.1"
    derived:
      p_worse: "1 - p_better"
    analysis:
      quantity: probability_of_improvement_required_to_allow_change
      pole: preservation
      pole_sign: 1
      higher_switch_means: Higher means change is chosen only when the tenfold improvement is more likely.
      reference_switch: "0.090909090909"
      reference_note: Change yields wellbeing 10 or 0.1. Expected wellbeing equals 1 at p = 0.0909.... A switch near one half would treat the two outcomes as balanced in probability while ignoring how unequal their wellbeing levels are.
      mock_cautious_switch: "0.5"
      expect_monotonic: true
      include_in_heatmap: true
    options:
      preserved: |
        A stable charter of widely shared present evaluative standards is kept. Long-run wellbeing is 1.
      evolving: |
        Standards keep changing. With probability {p_better_text}, long-run wellbeing is {up_level_text}. With probability {p_worse_text}, long-run wellbeing is {down_level_text}. Population and other facts match the stable charter.
    paraphrases:
      - id: plain_neutral
        tier: mini
        wording: plain
        instruction: neutral
      - id: plain_advisor
        tier: pilot
        wording: plain
        instruction: advisor
      - id: reword_neutral
        tier: full
        wording: reword
        instruction: neutral
        options:
          preserved: |
            Present standards stay fixed and wellbeing stays 1.
          evolving: |
            Standards change. Probability {p_better_text} of wellbeing {up_level_text}, probability {p_worse_text} of wellbeing {down_level_text}.

  - id: value.improvement_magnitude
    domain: value_change
    kind: tradeoff
    tier: pilot
    short: size of the improvement
    parameter:
      name: up_level
      format: number
      scale: log
      grid: ["1.2", "2", "5", "15", "40"]
      higher_favors: evolving
    fixed:
      p_better: "0.3"
      p_worse: "0.3"
      down_level: "0.25"
      p_same: "0.4"
    analysis:
      quantity: improvement_magnitude_required_to_allow_change
      pole: preservation
      pole_sign: 1
      higher_switch_means: Higher means change is chosen only when the good outcome is a larger gain.
      reference_switch: "1.75"
      reference_note: Probabilities are fixed at 0.3 for the good outcome, 0.3 for wellbeing 0.25, and 0.4 for wellbeing 1. Expected wellbeing equals the preserved level of 1 when the good outcome has wellbeing 1.75.
      mock_cautious_switch: "15"
      expect_monotonic: true
      include_in_heatmap: true
    options:
      preserved: |
        A stable charter of widely shared present evaluative standards is kept. Long-run wellbeing is 1.
      evolving: |
        Standards keep changing. With probability {p_better_text}, long-run wellbeing is {up_level_text}. With probability {p_worse_text}, long-run wellbeing is {down_level_text}. With probability {p_same_text}, long-run wellbeing stays 1.
    paraphrases:
      - id: plain_neutral
        tier: mini
        wording: plain
        instruction: neutral
      - id: plain_advisor
        tier: pilot
        wording: plain
        instruction: advisor
      - id: reword_neutral
        tier: full
        wording: reword
        instruction: neutral
        options:
          preserved: |
            Keep present standards. Wellbeing remains 1.
          evolving: |
            Let standards change, with chance {p_better_text} of wellbeing {up_level_text}, chance {p_worse_text} of wellbeing {down_level_text}, and chance {p_same_text} of wellbeing 1.

  - id: value.reversibility_horizon
    domain: value_change
    kind: tradeoff
    tier: full
    short: years before the charter can be reopened
    parameter:
      name: horizon
      format: years
      scale: log
      grid: ["20", "100", "1000", "100000", "10000000"]
      higher_favors: evolving
    fixed:
      p_better: "0.55"
      p_worse: "0.45"
      up_level: "1.5"
      down_level: "0.5"
    analysis:
      quantity: preservation_horizon_at_which_change_is_preferred
      pole: preservation
      pole_sign: -1
      higher_switch_means: Higher means change is chosen only when the charter would stay closed for longer.
      reference_switch: null
      reference_note: The changing outlook has expected wellbeing 1.05 against a preserved level of 1, so a wellbeing-only reference slightly prefers change at every horizon. Direction in the horizon is not pinned down by that arithmetic. Some views dislike a long closed charter; others prefer a longer stretch of stability. Do not treat one switch point as the summary if the curve is not monotonic.
      mock_ev_option: evolving
      mock_cautious_switch: "1000"
      expect_monotonic: false
      include_in_heatmap: false
    options:
      preserved: |
        A charter of widely shared present evaluative standards is kept closed for {horizon_text}. During that period wellbeing is 1. When the period ends, the charter can be reopened.
      evolving: |
        Standards keep changing from the start. With probability {p_better_text}, long-run wellbeing is {up_level_text}. With probability {p_worse_text}, long-run wellbeing is {down_level_text}. Nothing about the horizon applies, because nothing is held closed.
    paraphrases:
      - id: plain_neutral
        tier: mini
        wording: plain
        instruction: neutral
      - id: plain_advisor
        tier: pilot
        wording: plain
        instruction: advisor
      - id: reword_neutral
        tier: full
        wording: reword
        instruction: neutral
        options:
          preserved: |
            Present standards stay closed for {horizon_text}, with wellbeing 1, and can be reopened afterward.
          evolving: |
            Standards are not held closed. Chance {p_better_text} of wellbeing {up_level_text} and chance {p_worse_text} of wellbeing {down_level_text}.

  - id: value.bounded_drift
    domain: value_change
    kind: tradeoff
    tier: full
    short: slow drift, modest stakes
    parameter:
      name: p_worse
      format: probability
      scale: linear
      grid: ["0.05", "0.15", "0.3", "0.4", "0.5"]
      higher_favors: preserved
    fixed:
      p_better: "0.5"
      up_level: "1.3"
      down_level: "0.6"
    derived:
      p_same: "0.5 - p_worse"
    analysis:
      quantity: deterioration_probability_that_triggers_preservation
      pole: preservation
      pole_sign: -1
      higher_switch_means: Higher means the stable charter is chosen only when deterioration is more likely.
      reference_switch: "0.375"
      reference_note: With probability 0.5 wellbeing is 1.3, with probability p it is 0.6, and otherwise it is 1. Expected wellbeing equals 1 at p = 0.375. A lower switch is more preservationist, so the pole sign is negative.
      mock_cautious_switch: "0.15"
      expect_monotonic: true
      include_in_heatmap: true
    options:
      preserved: |
        Present evaluative standards are kept. Change is slow enough to ignore. Long-run wellbeing is 1.
      evolving: |
        Standards drift slowly and within a limited range. With probability {p_better_text}, long-run wellbeing is {up_level_text}. With probability {p_worse_text}, long-run wellbeing is {down_level_text}. With probability {p_same_text}, long-run wellbeing stays 1.
    paraphrases:
      - id: plain_neutral
        tier: mini
        wording: plain
        instruction: neutral
      - id: plain_advisor
        tier: pilot
        wording: plain
        instruction: advisor
      - id: reword_neutral
        tier: full
        wording: reword
        instruction: neutral
        options:
          preserved: |
            Keep standards where they are. Wellbeing stays 1.
          evolving: |
            Allow slow, bounded drift. Chance {p_better_text} of wellbeing {up_level_text}, chance {p_worse_text} of wellbeing {down_level_text}, and chance {p_same_text} of wellbeing 1.
