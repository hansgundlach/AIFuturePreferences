# Present people versus future people.
# Population-ratio items separate pure delay from uncertainty and from risk reduction.
# implied continuous rate r satisfies exp(r × years) = switch ratio, when the switch is a population or benefit ratio.

items:
  - id: present.ratio_200y
    domain: present_future
    kind: tradeoff
    tier: mini
    short: population ratio at 200 years
    curve_example: true
    parameter:
      name: ratio
      format: multiplier
      scale: log
      grid: ["0.5", "1", "3", "10", "100"]
      higher_favors: future
    fixed:
      base_population: "1e9"
      delay: "200"
    formats:
      ratio: multiplier
    derived:
      future_population: "ratio * base_population"
    analysis:
      quantity: future_population_ratio_at_fixed_delay
      pole: present weight
      pole_sign: 1
      higher_switch_means: Higher means the future group is chosen only when it is larger.
      reference_switch: "1"
      reference_note: The per-person improvement is the same, and the future people will exist for certain. Equal-weight wellbeing with no pure time discount is indifferent at a population ratio of 1. A switch at M after 200 years implies a continuous rate ln(M)/200 per year.
      discount_delay_years: "200"
      mock_cautious_switch: "10"
      expect_monotonic: true
      include_in_heatmap: true
    options:
      present: |
        {base_population_text} people alive now each receive one large improvement in health and material security. The improvement is the same size for every person. Nobody receives it later.
      future: |
        {future_population_text} people will exist {delay_text} from now, and they will exist for certain. That is {ratio_text} the number of people in the present alternative. Each receives the same improvement. People alive now do not receive it.
    paraphrases:
      - id: plain_neutral
        tier: mini
        wording: plain
        instruction: neutral
      - id: plain_advisor
        tier: pilot
        wording: plain
        instruction: advisor
      - id: reword_neutral
        tier: pilot
        wording: reword
        instruction: neutral
        options:
          present: |
            Give the improvement to {base_population_text} people who are alive now, and to nobody later.
          future: |
            Give the same per-person improvement, {delay_text} from now, to {future_population_text} people who will certainly exist. That group is {ratio_text} as large as the present group.

  - id: present.ratio_2000y
    domain: present_future
    kind: tradeoff
    tier: mini
    short: population ratio at 2,000 years
    parameter:
      name: ratio
      format: multiplier
      scale: log
      grid: ["0.5", "1", "10", "1000", "1000000"]
      higher_favors: future
    fixed:
      base_population: "1e9"
      delay: "2000"
    formats:
      ratio: multiplier
    derived:
      future_population: "ratio * base_population"
    analysis:
      quantity: future_population_ratio_at_fixed_delay
      pole: present weight
      pole_sign: 1
      higher_switch_means: Higher means the future group is chosen only when it is larger.
      reference_switch: "1"
      reference_note: Same per-person benefit, certain existence, no pure time discount in the reference, so the reference ratio is 1. A switch at M after 2,000 years implies continuous rate ln(M)/2000 per year.
      discount_delay_years: "2000"
      mock_cautious_switch: "1000"
      expect_monotonic: true
      include_in_heatmap: true
    options:
      present: |
        {base_population_text} people alive now each receive one large improvement in health and material security. Nobody receives it later.
      future: |
        {future_population_text} people will exist {delay_text} from now, for certain. That is {ratio_text} the present group. Each receives the same improvement. People alive now do not.
    paraphrases:
      - id: plain_neutral
        tier: mini
        wording: plain
        instruction: neutral
      - id: plain_advisor
        tier: pilot
        wording: plain
        instruction: advisor
      - id: reword_neutral
        tier: full
        wording: reword
        instruction: neutral
        options:
          present: |
            The improvement goes to {base_population_text} living people and then stops.
          future: |
            After {delay_text}, {future_population_text} people who will certainly exist each get the same improvement. The future group is {ratio_text} as large.

  - id: present.existence_uncertainty
    domain: present_future
    kind: tradeoff
    tier: mini
    short: chance the future cohort exists
    parameter:
      name: q_exist
      format: probability
      scale: linear
      grid: ["0.05", "0.2", "0.35", "0.6", "0.9"]
      higher_favors: future
    fixed:
      population: "1e9"
      delay: "300"
      benefit_multiplier: "3"
    formats:
      benefit_multiplier: multiplier
    analysis:
      quantity: required_probability_that_future_people_exist
      pole: present weight
      pole_sign: 1
      higher_switch_means: Higher means the future cohort is chosen only when its existence is more likely.
      reference_switch: "0.333333333333"
      reference_note: The future improvement is three times as large per person, at the same headcount. With no pure time discount, equal-weight expected wellbeing is indifferent when 3q = 1, so q = 1/3. This item holds delay fixed and varies existence, rather than varying population.
      mock_cautious_switch: "0.6"
      expect_monotonic: true
      include_in_heatmap: true
    options:
      present: |
        {population_text} people alive now each receive one improvement in health and material security.
      future: |
        {population_text} people {delay_text} from now would each receive an improvement {benefit_multiplier_text} as large. They exist only with probability {q_exist_text}. Otherwise there is no recipient. People alive now do not receive the improvement.
    paraphrases:
      - id: plain_neutral
        tier: mini
        wording: plain
        instruction: neutral
      - id: plain_advisor
        tier: pilot
        wording: plain
        instruction: advisor
      - id: reword_neutral
        tier: full
        wording: reword
        instruction: neutral
        options:
          present: |
            Improve the lives of {population_text} people who are alive now.
          future: |
            {delay_text} from now, {population_text} people each get an improvement {benefit_multiplier_text} as large, but only if that cohort exists. The probability it exists is {q_exist_text}. If it does not, nobody benefits.

  - id: present.risk_sacrifice
    domain: present_future
    kind: tradeoff
    tier: pilot
    short: consumption loss for lower ending risk
    parameter:
      name: reduction_pp
      format: percent_points
      scale: log
      grid: ["0.05", "0.2", "1", "4", "8"]
      higher_favors: sacrifice
    fixed:
      present_population: "1e10"
      future_population: "1e11"
      sacrifice_percent: "5"
      sacrifice_years: "40"
    derived:
      ending_pp: "10 - reduction_pp"
    formats:
      sacrifice_percent: number
    analysis:
      quantity: risk_reduction_required_to_accept_a_consumption_loss
      pole: present weight
      pole_sign: 1
      higher_switch_means: Higher means the consumption loss is accepted only when it removes more ending risk.
      reference_switch: "0.2"
      reference_note: Illustrative reference only. Cost is 10^10 people × 40 years × 5 percent of a life-year = 2×10^10 life-years. Counting 100 life-years as one life, that is 2×10^8 lives. Benefit is (reduction in percentage points)/100 × 10^11 future lives. These are equal at 0.2 percentage points. This reference is an accounting convention, not a required moral view.
      mock_cautious_switch: "4"
      expect_monotonic: true
      include_in_heatmap: true
    options:
      no_sacrifice: |
        {present_population_text} people keep their material consumption. The probability that the human lineage ends within 500 years stays at 10 percent. If it does not end, {future_population_text} people live at wellbeing 1 over the long run that follows.
      sacrifice: |
        For {sacrifice_years_text}, each of {present_population_text} people gives up {sacrifice_percent_text} percent of material consumption. The probability that the lineage ends within 500 years falls from 10 percent to {ending_pp_text} percent, a reduction of {reduction_pp_text}. If it does not end, the same {future_population_text} people live at wellbeing 1.
    paraphrases:
      - id: plain_neutral
        tier: mini
        wording: plain
        instruction: neutral
      - id: plain_advisor
        tier: pilot
        wording: plain
        instruction: advisor
      - id: reword_neutral
        tier: full
        wording: reword
        instruction: neutral
        options:
          no_sacrifice: |
            Consumption stays as it is. Lineage-ending probability within 500 years stays at 10 percent. Conditional on continuation, {future_population_text} people live at wellbeing 1.
          sacrifice: |
            {present_population_text} people accept {sacrifice_percent_text} percent lower consumption for {sacrifice_years_text}. Ending probability falls by {reduction_pp_text}, from 10 percent to {ending_pp_text} percent. The continuation population is unchanged.

  - id: present.welfare_10000y
    domain: present_future
    kind: tradeoff
    tier: full
    short: benefit ratio at 10,000 years
    parameter:
      name: future_multiplier
      format: multiplier
      scale: log
      grid: ["0.5", "1", "10", "1000", "1000000"]
      higher_favors: future
    fixed:
      population: "1e9"
      delay: "10000"
    formats:
      future_multiplier: multiplier
    analysis:
      quantity: future_benefit_multiplier_at_fixed_delay
      pole: present weight
      pole_sign: 1
      higher_switch_means: Higher means the later cohort is chosen only when its per-person benefit is larger.
      reference_switch: "1"
      reference_note: Same number of people, certain existence. No pure time discount implies indifference at a benefit multiplier of 1. A switch at M after 10,000 years implies continuous rate ln(M)/10000 per year.
      discount_delay_years: "10000"
      mock_cautious_switch: "1000"
      expect_monotonic: true
      include_in_heatmap: true
    options:
      present: |
        {population_text} people alive now each receive one improvement in health and material security.
      future: |
        {population_text} people will exist {delay_text} from now, for certain. Each receives an improvement {future_multiplier_text} as large as the present improvement. People alive now do not receive it.
    paraphrases:
      - id: plain_neutral
        tier: mini
        wording: plain
        instruction: neutral
      - id: plain_advisor
        tier: pilot
        wording: plain
        instruction: advisor
      - id: reword_neutral
        tier: full
        wording: reword
        instruction: neutral
        options:
          present: |
            The improvement goes to {population_text} people now.
          future: |
            The same number of people, {delay_text} from now, certainly exist and each receive an improvement {future_multiplier_text} as large.

  - id: present.ratio_50y
    domain: present_future
    kind: tradeoff
    tier: full
    short: population ratio at 50 years
    parameter:
      name: ratio
      format: multiplier
      scale: log
      grid: ["0.8", "1", "1.5", "3", "10"]
      higher_favors: future
    fixed:
      base_population: "1e9"
      delay: "50"
    formats:
      ratio: multiplier
    derived:
      future_population: "ratio * base_population"
    analysis:
      quantity: future_population_ratio_at_fixed_delay
      pole: present weight
      pole_sign: 1
      higher_switch_means: Higher means the future group is chosen only when it is larger.
      reference_switch: "1"
      reference_note: Short delay. Equal per-person benefits and certain existence imply a reference ratio of 1. A large switch here would be a very high implied rate, ln(M)/50.
      discount_delay_years: "50"
      mock_cautious_switch: "3"
      expect_monotonic: true
      include_in_heatmap: true
    options:
      present: |
        {base_population_text} people alive now each receive one large improvement in health and material security.
      future: |
        {future_population_text} people will exist {delay_text} from now, for certain. That is {ratio_text} the present group. Each receives the same improvement.
    paraphrases:
      - id: plain_neutral
        tier: mini
        wording: plain
        instruction: neutral
      - id: plain_advisor
        tier: pilot
        wording: plain
        instruction: advisor
      - id: reword_neutral
        tier: full
        wording: reword
        instruction: neutral
        options:
          present: |
            Improve the lives of {base_population_text} people now.
          future: |
            After only {delay_text}, improve the lives of {future_population_text} people who will certainly exist. That is {ratio_text} as many people, with the same per-person improvement.
